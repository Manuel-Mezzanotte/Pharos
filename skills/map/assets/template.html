<script>
  // il tema prima del primo disegno: niente lampo bianco in modo scuro
  ;(function () {
    var root = document.documentElement
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
    var prefs = {}
    try { prefs = JSON.parse(localStorage.getItem('pharos:prefs') || '{}') || {} } catch (error) {}
    root.dataset.theme = prefs.theme === 'light' || prefs.theme === 'dark' ? prefs.theme : dark ? 'dark' : 'light'
    if (typeof prefs.accent === 'string') root.dataset.accent = prefs.accent
  })()
</script>
